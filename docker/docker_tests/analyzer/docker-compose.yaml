# this is a client to query mongodb for cve data
# the cve data should be located in CVE_DIR

services:
  app:
    image: kuromesi/analyzer:test
    volumes:
      - ./tmpfiles:/shared
    ports:
      - 8001:8000
    environment:
      - MONGO_URI=mongodb://mongo/
      - MONGO_PORT=27017
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=example
  mongoclient:
    image: kuromesi/mongoclient:v0.1
    volumes:
      - ../mongo_client/tmpfiles:/shared
    ports:
      - 8000:8000
    environment:
      - CVE_DIR=/shared/cve
      - MONGO_URI=mongodb://mongo/
      - MONGO_PORT=27017
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=example
  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
   
   